<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CineStream — Painel de Fontes</title>
<style>
  :root{
    --bg:#0f1115; --surf:#171a21; --surf2:#1e222b; --bdr:#2a2f3a; --bdr2:#343a47;
    --tx:#eef0f4; --tx2:#b6bcc8; --tx3:#7d8494; --gold:#e8b84b; --red:#e84b4b; --green:#22d46a;
  }
  *{box-sizing:border-box;}
  body{background:var(--bg);color:var(--tx);font-family:-apple-system,Segoe UI,Roboto,sans-serif;
    margin:0;padding:20px;max-width:640px;margin:0 auto;}
  h1{font-size:20px;margin:8px 0 4px;}
  .sub{color:var(--tx3);font-size:13px;margin-bottom:20px;}
  .card{background:var(--surf);border:1px solid var(--bdr);border-radius:12px;padding:16px;margin-bottom:16px;}
  label{display:block;font-size:12px;color:var(--tx3);margin-bottom:5px;font-weight:600;}
  input[type=text],input[type=password]{
    width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--bdr2);
    background:var(--surf2);color:var(--tx);font-size:14px;margin-bottom:12px;
  }
  .row{display:flex;gap:8px;align-items:flex-end;margin-bottom:10px;}
  .row .f{flex:1;}
  .row label{margin-bottom:5px;}
  .row input{margin-bottom:0;}
  button{cursor:pointer;border:none;border-radius:8px;font-size:13px;font-weight:700;padding:9px 14px;}
  .btn-main{background:var(--gold);color:#1a1200;width:100%;padding:12px;font-size:14px;}
  .btn-add{background:var(--surf2);color:var(--tx2);border:1px solid var(--bdr2);width:100%;margin-top:4px;}
  .btn-del{background:rgba(232,75,75,.12);color:var(--red);flex-shrink:0;padding:9px 12px;}
  #status{font-size:13px;margin-top:12px;min-height:18px;}
  .ok{color:var(--green);}
  .err{color:var(--red);}
  #srcList{margin-bottom:6px;}
</style>
</head>
<body>

<h1>⚙️ CineStream — Painel de Fontes</h1>
<div class="sub">Edite a lista de fontes de stream direto no Worker.</div>

<div class="card">
  <label>Token de login</label>
  <input type="password" id="token" placeholder="Cole aqui token de acesso">
  <label style="display:flex;align-items:center;gap:6px;font-weight:400;">
    <input type="checkbox" id="remember" style="width:auto;margin:0;"> Lembrar neste navegador
  </label>
</div>

<div class="card">
  <div id="srcList"></div>
  <button class="btn-add" onclick="addRow()">+ Adicionar fonte</button>
</div>

<button class="btn-main" onclick="saveAll()">Salvar alterações</button>
<div id="status"></div>

<script>
const API_BASE = 'https://cinestream.adoniasalmeida.workers.dev';

function tokenField(){ return document.getElementById('token'); }
if(localStorage.getItem('cs_admin_token')){
  tokenField().value = localStorage.getItem('cs_admin_token');
  document.getElementById('remember').checked = true;
}

function rowHtml(name='', origin=''){
  return `<div class="row" data-row>
    <div class="f"><label>Nome</label><input type="text" data-name value="${name.replace(/"/g,'&quot;')}"></div>
    <div class="f"><label>Origin (URL base)</label><input type="text" data-origin value="${origin.replace(/"/g,'&quot;')}"></div>
    <button class="btn-del" onclick="this.closest('[data-row]').remove()">✕</button>
  </div>`;
}
function addRow(name='', origin=''){
  document.getElementById('srcList').insertAdjacentHTML('beforeend', rowHtml(name, origin));
}

async function loadSources(){
  setStatus('Carregando fontes atuais...', '');
  try{
    const data = await fetch(`${API_BASE}/sources`).then(r=>r.json());
    document.getElementById('srcList').innerHTML = '';
    data.forEach(s=>addRow(s.name, s.origin));
    setStatus(`${data.length} fontes carregadas.`, 'ok');
  }catch(e){
    setStatus('Não foi possível carregar as fontes do Worker.', 'err');
  }
}

async function saveAll(){
  const token = tokenField().value.trim();
  if(!token){ setStatus('Preencha o token de admin primeiro.', 'err'); return; }

  if(document.getElementById('remember').checked){
    localStorage.setItem('cs_admin_token', token);
  } else {
    localStorage.removeItem('cs_admin_token');
  }

  const rows = [...document.querySelectorAll('[data-row]')];
  const sources = rows.map(r=>({
    name: r.querySelector('[data-name]').value.trim(),
    origin: r.querySelector('[data-origin]').value.trim(),
  })).filter(s=>s.name && s.origin);

  if(!sources.length){ setStatus('Adicione ao menos uma fonte válida.', 'err'); return; }

  setStatus('Salvando...', '');
  try{
    const res = await fetch(`${API_BASE}/sources`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
      body: JSON.stringify(sources),
    });
    const data = await res.json();
    if(res.ok && data.ok){
      setStatus(`✓ Salvo! ${data.count} fontes atualizadas no Worker.`, 'ok');
    } else if(res.status === 401){
      setStatus('Token incorreto — verifique o ADMIN_TOKEN.', 'err');
    } else {
      setStatus('Erro ao salvar: ' + (data.error || res.status), 'err');
    }
  }catch(e){
    setStatus('Falha de conexão com o Worker.', 'err');
  }
}

function setStatus(msg, cls){
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = cls;
}

loadSources();
</script>
</body>
</html>
